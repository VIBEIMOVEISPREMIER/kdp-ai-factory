name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository foundation check
        run: |
          test -f README.md
          test -f .gitignore
          test -f .env.example
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md
          echo "KDP AI Factory foundation OK"

name: Build desktop binaries

on:
  push:
    branches: [main, 'release/v*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm install
          npm run build

      - name: Bundle dashboard
        shell: pwsh
        run: |
          if (Test-Path kdp_factory/static) { Remove-Item -Recurse -Force kdp_factory/static }
          New-Item -ItemType Directory -Force kdp_factory/static | Out-Null
          Copy-Item -Recurse apps/dashboard/dist/* kdp_factory/static/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Test Python
        run: |
          python -m compileall -q kdp_factory
          python -m pytest -q

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --name KDP-AI-Factory-Windows --paths . --hidden-import kdp_factory.cli --hidden-import webview.platforms.edgechromium --collect-all webview --add-data "kdp_factory/static;kdp_factory/static" --collect-all kdp_factory packaging/launcher.py
          if (!(Test-Path dist/KDP-AI-Factory-Windows.exe)) { throw "Windows EXE was not created." }

      - name: Smoke test Windows local API
        shell: pwsh
        run: |
          $env:KDP_FACTORY_PORT = "8000"
          $p = Start-Process -FilePath "dist/KDP-AI-Factory-Windows.exe" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 3
                if ($health.StatusCode -eq 200 -and $health.Content -match '"ok"\s*:\s*true') { $ok = $true; break }
              } catch {}
              if ($p.HasExited) { throw "Windows EXE exited during smoke test." }
              Start-Sleep -Seconds 1
            }
            if (!$ok) { throw "Windows EXE local API did not become healthy." }

            $root = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 10
            if ($root.StatusCode -ne 200) { throw "Dashboard returned HTTP $($root.StatusCode)." }
            if ($root.Content -notmatch "KDP AI Factory") { throw "Bundled dashboard HTML was not served." }
            if ($root.Content -match "kdp-ai-factory-license-server|onrender.com") { throw "Desktop build is pointing at the remote SaaS/license website." }
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows-installer.iss
          if (!(Test-Path dist/installer/KDP-AI-Factory-Setup.exe)) { throw "Windows installer was not created." }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KDP-AI-Factory-Windows
          path: |
            dist/KDP-AI-Factory-Windows.exe
            dist/installer/KDP-AI-Factory-Setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm install
          npm run build
      - name: Bundle dashboard
        run: |
          rm -rf kdp_factory/static
          mkdir -p kdp_factory/static
          cp -R apps/dashboard/dist/. kdp_factory/static/
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Test Python
        run: |
          python -m compileall -q kdp_factory
          python -m pytest -q
      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name KDP-AI-Factory-Linux --paths . --hidden-import kdp_factory.cli --add-data "kdp_factory/static:kdp_factory/static" --collect-all kdp_factory packaging/launcher.py
          test -f dist/KDP-AI-Factory-Linux
          chmod +x dist/KDP-AI-Factory-Linux
          ./dist/KDP-AI-Factory-Linux > /tmp/kdp-ai-factory.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health >/tmp/kdp-health.json; then
              grep -q '"ok":true' /tmp/kdp-health.json
              exit 0
            fi
            if ! kill -0 $pid 2>/dev/null; then
              cat /tmp/kdp-ai-factory.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/kdp-ai-factory.log
          exit 1
      - name: Package Linux installer
        run: |
          mkdir -p dist/linux-installer
          cp dist/KDP-AI-Factory-Linux dist/linux-installer/
          cp packaging/install-linux.sh dist/linux-installer/
          chmod +x dist/linux-installer/KDP-AI-Factory-Linux dist/linux-installer/install-linux.sh
          tar -C dist/linux-installer -czf dist/KDP-AI-Factory-Linux-Installer.tar.gz .

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: KDP-AI-Factory-Linux
          path: |
            dist/KDP-AI-Factory-Linux
            dist/KDP-AI-Factory-Linux-Installer.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: KDP-AI-Factory-Windows
          path: release/windows
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: KDP-AI-Factory-Linux
          path: release/linux
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/heads/release/') && github.ref_name || github.ref_name }}
          files: |
            release/windows/KDP-AI-Factory-Windows.exe
            release/windows/KDP-AI-Factory-Setup.exe
            release/linux/KDP-AI-Factory-Linux
            release/linux/KDP-AI-Factory-Linux-Installer.tar.gz

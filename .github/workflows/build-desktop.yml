name: Build desktop binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build
      - name: Bundle dashboard
        shell: pwsh
        run: |
          if (Test-Path kdp_factory/static) { Remove-Item -Recurse -Force kdp_factory/static }
          New-Item -ItemType Directory -Force kdp_factory/static | Out-Null
          Copy-Item -Recurse apps/dashboard/dist/* kdp_factory/static/
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --name KDP-AI-Factory-Windows --add-data "kdp_factory/static;kdp_factory/static" packaging/launcher.py
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KDP-AI-Factory-Windows
          path: dist/KDP-AI-Factory-Windows.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build
      - name: Bundle dashboard
        run: |
          rm -rf kdp_factory/static
          mkdir -p kdp_factory/static
          cp -R apps/dashboard/dist/. kdp_factory/static/
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name KDP-AI-Factory-Linux --add-data "kdp_factory/static:kdp_factory/static" packaging/launcher.py
          chmod +x dist/KDP-AI-Factory-Linux
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: KDP-AI-Factory-Linux
          path: dist/KDP-AI-Factory-Linux

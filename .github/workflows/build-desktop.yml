name: Build desktop binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm install
          npm run build
      - name: Bundle dashboard
        shell: pwsh
        run: |
          if (Test-Path kdp_factory/static) { Remove-Item -Recurse -Force kdp_factory/static }
          New-Item -ItemType Directory -Force kdp_factory/static | Out-Null
          Copy-Item -Recurse apps/dashboard/dist/* kdp_factory/static/
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --name KDP-AI-Factory-Windows --paths . --hidden-import kdp_factory.cli --add-data "kdp_factory/static;kdp_factory/static" --collect-all kdp_factory packaging/launcher.py
          if (!(Test-Path dist/KDP-AI-Factory-Windows.exe)) { throw "Windows EXE was not created." }
          & dist/KDP-AI-Factory-Windows.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Windows EXE smoke test failed with exit code $LASTEXITCODE." }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KDP-AI-Factory-Windows
          path: dist/KDP-AI-Factory-Windows.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm install
          npm run build
      - name: Bundle dashboard
        run: |
          rm -rf kdp_factory/static
          mkdir -p kdp_factory/static
          cp -R apps/dashboard/dist/. kdp_factory/static/
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name KDP-AI-Factory-Linux --paths . --hidden-import kdp_factory.cli --add-data "kdp_factory/static:kdp_factory/static" --collect-all kdp_factory packaging/launcher.py
          test -f dist/KDP-AI-Factory-Linux
          chmod +x dist/KDP-AI-Factory-Linux
          dist/KDP-AI-Factory-Linux --help
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: KDP-AI-Factory-Linux
          path: dist/KDP-AI-Factory-Linux


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: KDP-AI-Factory-Windows
          path: release/windows
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: KDP-AI-Factory-Linux
          path: release/linux
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/windows/KDP-AI-Factory-Windows.exe
            release/linux/KDP-AI-Factory-Linux

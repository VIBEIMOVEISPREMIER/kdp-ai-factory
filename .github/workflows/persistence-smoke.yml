name: persistence smoke test
on:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Create trial device
        run: |
          MACHINE=$(python - <<'PY'
import secrets
print(secrets.token_hex(32))
PY
)
          echo "MACHINE=$MACHINE" >> "$GITHUB_ENV"
          curl -fsS -X POST "https://kdp-ai-factory-web.onrender.com/api/license/trial/register"             -H "Content-Type: application/json"             -d "{\"machine_id\":\"$MACHINE\"}" | tee trial.json
      - name: Create project and verify API
        run: |
          RESP=$(curl -fsS -X POST "https://kdp-ai-factory-web.onrender.com/api/projects"             -H "Content-Type: application/json"             -d '{"name":"PERSISTENCE_SMOKE_TEST","book_type":"coloring","language":"pt-BR","subject":"smoke-test","edition":"ebook"}')
          echo "$RESP" | tee project.json
          ID=$(python -c 'import json; print(json.load(open("project.json"))["id"])')
          test -n "$ID"
          curl -fsS "https://kdp-ai-factory-web.onrender.com/api/projects/$ID" | tee verify.json
          grep -q "$ID" verify.json

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdp-ai-factory"
version = "0.1.0"
description = "Local-first AI publishing factory for creating and preparing books for KDP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "psutil>=6,<7"
]

[project.scripts]
kdp-factory = "kdp_factory.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["kdp_factory*"]

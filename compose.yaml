name: kdp-ai-factory

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      KDP_FACTORY_DATA_DIR: /app/data
      OLLAMA_BASE_URL: http://ollama:11434
      COMFYUI_BASE_URL: http://comfyui:8188
    volumes:
      - kdp_factory_data:/app/data
    depends_on:
      ollama:
        condition: service_started
      comfyui:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  comfyui:
    image: ghcr.io/lecode-official/comfyui-docker:latest
    restart: unless-stopped
    environment:
      CLI_ARGS: "--listen 0.0.0.0 --port 8188"
    volumes:
      - comfyui_models:/opt/comfyui/models
      - comfyui_custom_nodes:/opt/comfyui/custom_nodes
      - comfyui_output:/opt/comfyui/output

volumes:
  kdp_factory_data:
  ollama_data:
  comfyui_models:
  comfyui_custom_nodes:
  comfyui_output:
